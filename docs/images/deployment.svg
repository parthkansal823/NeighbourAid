<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" width="1060" height="620" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d8590"/>
    </marker>
    <marker id="dg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="1060" height="620" fill="#0d1117"/>

  <text x="34" y="42" fill="#e6edf3" font-size="21" font-weight="600">Hosted frontend, local backend</text>
  <text x="34" y="64" fill="#8b949e" font-size="13">Web and APK use the same public URL. The API and database run on your laptop.</text>

  <!-- user -->
  <rect x="40" y="100" width="180" height="76" rx="10" fill="#1f2937" stroke="#3b82f6"/>
  <text x="130" y="130" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Web / Android APK</text>
  <text x="130" y="152" fill="#8b949e" font-size="12" text-anchor="middle">stable Worker address</text>

  <!-- cloudflare -->
  <rect x="290" y="92" width="290" height="92" rx="10" fill="#0f2e2b" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="435" y="118" fill="#2dd4bf" font-size="12.5" font-weight="600" text-anchor="middle">CLOUDFLARE WORKER</text>
  <text x="435" y="142" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">React UI + API / WS proxy</text>
  <text x="435" y="163" fill="#8b949e" font-size="11.5" text-anchor="middle">UI stays hosted when the laptop is off</text>
  <text x="435" y="177" fill="#8b949e" font-size="11.5" text-anchor="middle">npm run deploy</text>

  <!-- local Docker stack; no cloud backend -->
  <rect x="650" y="92" width="376" height="326" rx="10" fill="#161b22" stroke="#f97316" stroke-width="1.5"/>
  <text x="838" y="118" fill="#f97316" font-size="12.5" font-weight="600" text-anchor="middle">YOUR LAPTOP · DOCKER DESKTOP</text>
  <text x="838" y="136" fill="#8b949e" font-size="11.5" text-anchor="middle">Start on demand · laptop must be awake</text>

  <rect x="670" y="148" width="336" height="52" rx="8" fill="#2a1a0e" stroke="#f59e0b"/>
  <text x="838" y="170" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">cloudflared tunnel</text>
  <text x="838" y="189" fill="#8b949e" font-size="11.5" text-anchor="middle">Tunnel forwards requests to api:8000</text>

  <rect x="670" y="212" width="336" height="60" rx="8" fill="#1f2937" stroke="#f97316"/>
  <text x="838" y="235" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">FastAPI + triage + WebSockets</text>
  <text x="838" y="256" fill="#fdba74" font-size="11.5" text-anchor="middle">one worker · no host/LAN API port</text>

  <!-- local MongoDB -->
  <rect x="670" y="330" width="336" height="76" rx="10" fill="#14312a" stroke="#10b981" stroke-width="1.5"/>
  <text x="838" y="357" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">MongoDB in Docker</text>
  <text x="838" y="378" fill="#6ee7b7" font-size="11.5" text-anchor="middle">authentication · private Docker network</text>
  <text x="838" y="395" fill="#8b949e" font-size="11.5" text-anchor="middle">persistent local volumes · no public DB port</text>

  <!-- independent fictional demo -->
  <rect x="290" y="330" width="290" height="76" rx="10" fill="#221a3a" stroke="#a78bfa"/>
  <text x="435" y="357" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Separate demo website</text>
  <text x="435" y="378" fill="#c4b5fd" font-size="11.5" text-anchor="middle">fictional browser-local sample data</text>
  <text x="435" y="395" fill="#8b949e" font-size="11.5" text-anchor="middle">no connection to the real API or database</text>

  <!-- arrows -->
  <path d="M224 130 L284 130" stroke="#2dd4bf" stroke-width="2" marker-end="url(#d)"/>
  <text x="254" y="122" fill="#2dd4bf" font-size="11" text-anchor="middle">app</text>

  <path d="M584 152 L644 176" stroke="#f97316" stroke-width="2" marker-end="url(#d)"/>
  <text x="602" y="146" fill="#f97316" font-size="11">tunnel</text>

  <path d="M838 278 L838 324" stroke="#10b981" stroke-width="2" marker-end="url(#dg)"/>
  <path d="M130 176 L130 366 L284 366" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#d)"/>
  <path d="M838 200 L838 206" stroke="#f97316" stroke-width="2" marker-end="url(#d)"/>

  <!-- operating limits -->
  <rect x="34" y="446" width="992" height="152" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="472" fill="#e6edf3" font-size="13" font-weight="600">What stays online, and what needs your laptop</text>
  <g font-size="12" fill="#8b949e">
    <text x="50" y="500"><tspan fill="#e6edf3" font-weight="600">Real app</tspan> — hosted UI stays available; accounts, alerts and live updates need the laptop stack and tunnel online.</text>
    <text x="50" y="524"><tspan fill="#e6edf3" font-weight="600">Start / stop</tspan> — npm run server:connect / npm run server:stop. Normal stop/start keeps database volumes.</text>
    <text x="50" y="548"><tspan fill="#e6edf3" font-weight="600">CI/CD</tspan> — code tests, frontend deployment and APK releases only. No backend deployment or Docker image build.</text>
    <text x="50" y="572"><tspan fill="#e6edf3" font-weight="600">Limits</tspan> — Quick Tunnels are for development/testing, not an always-on emergency-service guarantee.</text>
  </g>
</svg>
