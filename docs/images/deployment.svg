<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" width="1060" height="620" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d8590"/>
    </marker>
    <marker id="dg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="1060" height="620" fill="#0d1117"/>

  <text x="34" y="42" fill="#e6edf3" font-size="21" font-weight="600">Deployment topology — ₹0/month</text>
  <text x="34" y="64" fill="#8b949e" font-size="13">Three hosts, each chosen for a constraint the others could not meet.</text>

  <!-- user -->
  <rect x="40" y="100" width="180" height="76" rx="10" fill="#1f2937" stroke="#3b82f6"/>
  <text x="130" y="130" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">User in India</text>
  <text x="130" y="152" fill="#8b949e" font-size="12" text-anchor="middle">phone, often on mobile data</text>

  <!-- cloudflare -->
  <rect x="290" y="92" width="290" height="92" rx="10" fill="#0f2e2b" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="435" y="118" fill="#2dd4bf" font-size="12.5" font-weight="600" text-anchor="middle">CLOUDFLARE WORKERS · free</text>
  <text x="435" y="142" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">React SPA (static)</text>
  <text x="435" y="163" fill="#8b949e" font-size="11.5" text-anchor="middle">edge cache · SPA fallback · CSP</text>
  <text x="435" y="177" fill="#8b949e" font-size="11.5" text-anchor="middle">npm run deploy</text>

  <!-- droplet -->
  <rect x="650" y="92" width="376" height="196" rx="10" fill="#161b22" stroke="#f97316" stroke-width="1.5"/>
  <text x="838" y="118" fill="#f97316" font-size="12.5" font-weight="600" text-anchor="middle">DIGITALOCEAN DROPLET · Bangalore</text>
  <text x="838" y="136" fill="#8b949e" font-size="11.5" text-anchor="middle">$200 GitHub Student credit · 1 GB · never sleeps</text>

  <rect x="670" y="148" width="336" height="52" rx="8" fill="#2a1a0e" stroke="#f59e0b"/>
  <text x="838" y="170" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">Caddy — automatic Let’s Encrypt TLS</text>
  <text x="838" y="189" fill="#8b949e" font-size="11.5" text-anchor="middle">only exposed port · wss:// depends on this</text>

  <rect x="670" y="212" width="336" height="60" rx="8" fill="#1f2937" stroke="#f97316"/>
  <text x="838" y="235" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">FastAPI + triage + WebSockets</text>
  <text x="838" y="256" fill="#fdba74" font-size="11.5" text-anchor="middle">64 MB measured · one worker</text>

  <!-- atlas -->
  <rect x="650" y="330" width="376" height="76" rx="10" fill="#14312a" stroke="#10b981" stroke-width="1.5"/>
  <text x="838" y="357" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">MongoDB Atlas M0 · Mumbai</text>
  <text x="838" y="378" fill="#6ee7b7" font-size="11.5" text-anchor="middle">free forever · 2dsphere geo index</text>
  <text x="838" y="395" fill="#8b949e" font-size="11.5" text-anchor="middle">same region — several round trips per request</text>

  <!-- uptime -->
  <rect x="290" y="330" width="290" height="76" rx="10" fill="#221a3a" stroke="#a78bfa"/>
  <text x="435" y="357" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">UptimeRobot · free</text>
  <text x="435" y="378" fill="#c4b5fd" font-size="11.5" text-anchor="middle">GET /health/ready every 5 min</text>
  <text x="435" y="395" fill="#8b949e" font-size="11.5" text-anchor="middle">503 names the broken component</text>

  <!-- arrows -->
  <path d="M224 130 L284 130" stroke="#2dd4bf" stroke-width="2" marker-end="url(#d)"/>
  <text x="254" y="122" fill="#2dd4bf" font-size="11" text-anchor="middle">app</text>

  <path d="M584 152 L644 176" stroke="#f97316" stroke-width="2" marker-end="url(#d)"/>
  <text x="600" y="146" fill="#f97316" font-size="11">HTTPS + WSS</text>

  <path d="M838 278 L838 324" stroke="#10b981" stroke-width="2" marker-end="url(#dg)"/>
  <path d="M584 366 L644 366" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#d)"/>
  <path d="M435 330 L435 200 L586 200" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#d)"/>

  <!-- constraints table -->
  <rect x="34" y="446" width="992" height="152" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="472" fill="#e6edf3" font-size="13" font-weight="600">Why not the obvious free options</text>
  <g font-size="12" fill="#8b949e">
    <text x="50" y="500"><tspan fill="#e6edf3" font-weight="600">Hugging Face</tspan> — free tier is ZeroGPU only; CPU basic now needs PRO. ZeroGPU expects a GPU demo, not a stateful WebSocket API.</text>
    <text x="50" y="524"><tspan fill="#e6edf3" font-weight="600">Render free</tspan> — technically fine (64 MB of 512 MB measured), but 750 instance-hours are per ACCOUNT and one always-warm service uses ~730.</text>
    <text x="50" y="548"><tspan fill="#e6edf3" font-weight="600">Oracle / Fly / Railway / AWS</tspan> — all require a credit card.</text>
    <text x="50" y="572"><tspan fill="#e6edf3" font-weight="600">Vercel / Netlify / Workers</tspan> — serverless; cannot hold a WebSocket open, which this app's whole live feed depends on.</text>
  </g>
</svg>
