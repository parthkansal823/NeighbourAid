<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" width="1060" height="720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d8590"/>
    </marker>
    <marker id="tr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="1060" height="720" fill="#0d1117"/>

  <text x="34" y="42" fill="#e6edf3" font-size="21" font-weight="600">How a report becomes an urgency</text>
  <text x="34" y="64" fill="#8b949e" font-size="13">Patterns run before keywords — and that ordering is load-bearing.</text>

  <!-- input -->
  <rect x="380" y="92" width="300" height="58" rx="10" fill="#1f2937" stroke="#3b82f6"/>
  <text x="530" y="117" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Report text</text>
  <text x="530" y="137" fill="#8b949e" font-size="12" text-anchor="middle">any of 8 languages, native or romanised</text>
  <path d="M530 150 L530 176" stroke="#7d8590" stroke-width="2" marker-end="url(#t)"/>

  <!-- pattern gate -->
  <rect x="330" y="178" width="400" height="76" rx="10" fill="#3b1a1a" stroke="#ef4444" stroke-width="2"/>
  <text x="530" y="204" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">1 · PATTERN — person + negated vital function</text>
  <text x="530" y="226" fill="#fca5a5" font-size="12" text-anchor="middle">“won’t answer” · “bol nahi rahe” · “दिख नहीं रहा”</text>
  <text x="530" y="244" fill="#8b949e" font-size="11.5" text-anchor="middle">17 regexes across 8 languages</text>

  <path d="M330 216 L200 216 L200 560" stroke="#ef4444" stroke-width="2.5" fill="none" marker-end="url(#tr)"/>
  <text x="208" y="300" fill="#ef4444" font-size="12" font-weight="600">match</text>
  <path d="M530 254 L530 288" stroke="#7d8590" stroke-width="2" marker-end="url(#t)"/>
  <text x="540" y="276" fill="#8b949e" font-size="12">no match</text>

  <!-- keyword bands -->
  <rect x="330" y="290" width="400" height="52" rx="9" fill="#3b1a1a" stroke="#ef4444"/>
  <text x="530" y="312" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">2 · CRITICAL keyword</text>
  <text x="530" y="332" fill="#fca5a5" font-size="11.5" text-anchor="middle">behosh · மயக்கம் · অজ্ঞান · બેભાન · ਬੇਹੋਸ਼</text>
  <path d="M330 316 L240 316 L240 556" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#tr)"/>
  <path d="M530 342 L530 368" stroke="#7d8590" stroke-width="2" marker-end="url(#t)"/>

  <rect x="330" y="370" width="400" height="52" rx="9" fill="#7c2d12" stroke="#f97316"/>
  <text x="530" y="392" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">3 · HIGH keyword</text>
  <text x="530" y="412" fill="#fdba74" font-size="11.5" text-anchor="middle">आग · வெள்ளம் · ਹੜ੍ਹ · gas leak · ਹਾਦਸਾ</text>
  <path d="M730 396 L830 396 L830 556" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#t)"/>
  <path d="M530 422 L530 448" stroke="#7d8590" stroke-width="2" marker-end="url(#t)"/>

  <rect x="330" y="450" width="400" height="52" rx="9" fill="#14532d" stroke="#22c55e"/>
  <text x="530" y="472" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">4 · LOW keyword</text>
  <text x="530" y="492" fill="#86efac" font-size="11.5" text-anchor="middle">stray · जानकारी · તર્વાત · কাল · information</text>
  <path d="M730 476 L920 476 L920 556" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#t)"/>
  <path d="M530 502 L530 552" stroke="#eab308" stroke-width="2" marker-end="url(#t)"/>
  <text x="540" y="530" fill="#eab308" font-size="12">nothing matched</text>

  <!-- outcomes -->
  <rect x="150" y="558" width="180" height="60" rx="9" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="240" y="583" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">CRITICAL</text>
  <text x="240" y="603" fill="#fca5a5" font-size="11.5" text-anchor="middle">confidence 0.8</text>

  <rect x="440" y="558" width="180" height="60" rx="9" fill="#78350f" stroke="#eab308" stroke-width="2"/>
  <text x="530" y="583" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">MEDIUM</text>
  <text x="530" y="603" fill="#fde68a" font-size="11.5" text-anchor="middle">0.4 — the honest “don’t know”</text>

  <rect x="740" y="558" width="180" height="60" rx="9" fill="#7c2d12" stroke="#f97316" stroke-width="2"/>
  <text x="830" y="583" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">HIGH</text>
  <text x="830" y="603" fill="#fdba74" font-size="11.5" text-anchor="middle">0.7</text>

  <rect x="930" y="558" width="100" height="60" rx="9" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="980" y="583" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">LOW</text>
  <text x="980" y="603" fill="#86efac" font-size="11.5" text-anchor="middle">0.6</text>

  <!-- why ordering -->
  <rect x="34" y="644" width="992" height="56" rx="9" fill="#161b22" stroke="#f97316"/>
  <text x="50" y="666" fill="#f97316" font-size="12.5" font-weight="600">Why patterns go first</text>
  <text x="50" y="686" fill="#8b949e" font-size="12">“madad chahiye, baba bol nahi rahe” contains the HIGH keyword <tspan fill="#fdba74">madad</tspan>. Keywords-first would call it HIGH and never see that a person has stopped speaking.</text>
</svg>
