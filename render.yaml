# Render Blueprint — backend only. Frontend goes to Cloudflare, database to
# MongoDB Atlas. See DEPLOY.md.
#
# Render's free plan is a deliberate fit, not just the cheap option: it does
# not autoscale. app/services/websocket.py keeps connected volunteers in a
# plain in-process dict, so a second instance would hold a second, invisible
# half of the volunteer pool and an alert would reach only whoever shared a
# box with the reporter. The plan that cannot scale cannot break this.
#
# Read that as a ceiling, not a design: moving the manager behind Redis
# pub/sub is what unlocks a paid, multi-instance plan later.
#
# The free plan sleeps after 15 minutes with no inbound request and takes
# ~50s to wake. That is unacceptable for an app whose first request after a
# quiet spell is someone pressing SOS — so an UptimeRobot monitor polls
# /health/ready every 5 minutes and the timer never fires. 750 free
# instance-hours a month covers a calendar month's ~730, but only for ONE
# free service; a second on the same account pushes you over and both get
# suspended.
services:
  - type: web
    name: neighbouraid-api
    runtime: docker
    plan: free
    # Closest Render region to Indian users — they have no Mumbai presence.
    # Pin Atlas to Mumbai anyway (see DEPLOY.md): several database round
    # trips happen per request, so that hop matters more than this one.
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Liveness, not readiness. /health checks nothing on purpose, so a
    # transient Atlas blip can never make Render recycle a healthy container.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Turns the "you're on the public dev JWT secret" warning into a hard
      # startup failure. Without it a misconfigured deploy boots happily with
      # a signing key that is published in this repo.
      - key: ENVIRONMENT
        value: production

      # Generated and stored by Render — never transits your clipboard or
      # shell history. 256 bits, comfortably above the 32-byte HS256 floor
      # that config.py enforces at startup.
      - key: JWT_SECRET
        generateValue: true

      # sync:false = "prompt me, don't store it in git."
      - key: MONGO_URL
        sync: false

      # Optional. Unset means triage runs on the multilingual keyword
      # heuristic in app/services/vocab.py — free, instant, and covering all
      # eight UI languages. The app does not fail without this.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Only needed for a custom domain. The CORS regex in main.py already
      # covers *.pages.dev and *.workers.dev.
      - key: FRONTEND_ORIGINS
        sync: false
