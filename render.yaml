# Render Blueprint — backend only. The frontend goes to Cloudflare Pages and
# the database to MongoDB Atlas; see DEPLOY.md.
#
# Render's free plan is a deliberate fit here rather than just the cheap
# option: it does not autoscale. app/services/websocket.py keeps connected
# volunteers in a plain in-process dict, so a second instance would hold a
# second, invisible half of the volunteer pool and alerts would reach only
# whoever happened to land on the broadcasting box. The plan that cannot
# scale is the plan that cannot break this.
#
# Read that as a ceiling, not a design: moving the manager behind Redis
# pub/sub is what unlocks a paid, multi-instance plan later.
services:
  - type: web
    name: neighbouraid-api
    runtime: docker
    plan: free
    # Closest Render region to Indian users — they have no Mumbai presence.
    # Atlas should be pinned to the same city (see DEPLOY.md) so the app and
    # its database are not on opposite sides of an ocean.
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Turns the "you're on the public dev JWT secret" warning into a hard
      # startup failure. Without this a misconfigured deploy boots happily
      # with a signing key that is published in this repo.
      - key: ENVIRONMENT
        value: production

      # Rendered once and stored by Render — never transits your clipboard or
      # shell history. Generates a 256-bit value, comfortably above the
      # 32-byte HS256 floor that config.py enforces at startup.
      - key: JWT_SECRET
        generateValue: true

      # sync:false = "prompt me, don't store it in git."
      - key: MONGO_URL
        sync: false

      # Optional. Unset means triage degrades to the keyword heuristic in
      # app/services/ai.py, which is free and still works — the app does not
      # fail without it.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Only needed for a custom domain. The CORS regex in main.py already
      # covers *.pages.dev, so a stock Cloudflare Pages URL needs nothing.
      - key: FRONTEND_ORIGINS
        sync: false
