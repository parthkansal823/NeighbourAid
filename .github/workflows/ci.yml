name: NeighbourAid CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI: "true"

defaults:
  run:
    shell: bash

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate workflow syntax and expressions
        run: bash .github/scripts/check-workflows.sh

      - name: Test CI and release safety policies
        run: node --test .github/scripts/*.test.mjs .github/scripts/*.test.cjs

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt

      - name: Install backend and pinned CI tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ci.txt
          python -m pip check

      - name: Ruff correctness checks
        # The repository intentionally has a separate legacy style backlog.
        run: python -m ruff check app --select=E9,F63,F7,F82 --output-format=github

      - name: Run backend tests with coverage and failure reports
        run: python -m pytest tests/ -q --tb=short --junitxml=test-results/pytest.xml --cov=app --cov-report=xml --cov-report=term --cov-fail-under=80

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-reports-python-${{ matrix.python-version }}
          path: |
            backend/coverage.xml
            backend/test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend and Worker tests
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.xml

      - name: Verify updater tests with a later Android build number
        env:
          VERSION_CODE: "1000000"
        run: npm test -- src/utils/androidUpdate.test.js

      - name: Test server setup tools
        run: npm run test:tools

      - name: Reject committed runtime or signing secrets
        run: npm run check:private

      - name: Build direct-API compatibility target
        env:
          VITE_API_URL: "https://ci-placeholder.invalid"
          VITE_WS_URL: "wss://ci-placeholder.invalid"
        run: npm run build

      - name: Build production edge-proxy frontend
        env:
          VITE_EDGE_PROXY: "1"
        run: npm run build

      - name: Validate Worker deployment package without credentials
        run: npx --no-install wrangler deploy --dry-run --outdir .wrangler/ci-package

      - name: Record the artifact's tested revision
        run: node -e 'require("node:fs").writeFileSync("dist/ci-build.json", JSON.stringify({sha:process.env.GITHUB_SHA,run_id:process.env.GITHUB_RUN_ID,target:"edge"}) + "\n")'

      - name: Upload the tested production frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-edge-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

      - name: Build standalone fictional demo
        run: npm run demo:build

      - name: Upload frontend failure reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-test-reports
          path: frontend/test-results
          if-no-files-found: warn
          retention-days: 14

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [python, npm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.ecosystem == 'python'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt

      - name: Install Python dependencies and audit tooling
        if: matrix.ecosystem == 'python'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-ci.txt
          python -m pip check

      - name: Block known Python dependency vulnerabilities
        if: matrix.ecosystem == 'python'
        run: python -m pip_audit --progress-spinner off --format json --output backend/pip-audit.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.ecosystem == 'npm'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend runtime and build tooling
        if: matrix.ecosystem == 'npm'
        # High/critical findings block CI, including build tooling. Lower-severity
        # findings retain their full reports; audit service errors also fail.
        run: node .github/scripts/audit-frontend.mjs frontend/audit-reports

      - name: Upload security reports even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-audit-${{ matrix.ecosystem }}
          path: |
            backend/pip-audit.json
            frontend/audit-reports
          if-no-files-found: warn
          retention-days: 14

  # Use this stable check for branch protection and production release gates.
  # always() ensures a failed/cancelled prerequisite cannot silently skip it.
  ci-success:
    if: always()
    needs: [workflow-lint, backend-test, frontend-lint, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS)
          const rows = Object.entries(jobs).map(([name, job]) => `| ${name} | ${job.result} |`)
          require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `| CI check | Result |\n|---|---|\n${rows.join('\n')}\n`)
          const failed = Object.entries(jobs).filter(([, job]) => job.result !== 'success')
          if (failed.length) {
            console.error(`CI rejected: ${failed.map(([name, job]) => `${name}=${job.result}`).join(', ')}`)
            process.exitCode = 1
          }
          NODE
